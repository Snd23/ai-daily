[project]
name = "ai-daily"
version = "0.1.0"
description = "Automated AI News Intelligence & Learning Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    # Official Anthropic/OpenAI SDKs behind the LLMProvider abstraction
    # (TASK-014, CLAUDE.md §6/§19, docs/PRD.md §22): a hand-rolled REST
    # client over `requests` or a third-party unifying library were both
    # considered and rejected -- see app/llm/anthropic_provider.py and
    # app/llm/openai_provider.py module docstrings for the full rationale.
    "anthropic>=1.5",
    "openai>=3.14",
    "feedparser>=6.0",
    "langdetect>=1.0",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "requests>=2.31",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "responses>=0.25",
    "types-requests>=2.31",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["app"]

# feedparser ships no py.typed marker and no stubs package exists on PyPI
# (checked for TASK-007); every other dependency here has real types.
[[tool.mypy.overrides]]
module = "feedparser"
ignore_missing_imports = true

# langdetect ships no py.typed marker and no stubs package exists on PyPI
# (checked for TASK-008); the wildcard also covers its submodules
# (e.g. langdetect.lang_detect_exception).
[[tool.mypy.overrides]]
module = "langdetect.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
