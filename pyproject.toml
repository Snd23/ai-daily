[project]
name = "ai-daily"
version = "0.1.0"
description = "Automated AI News Intelligence & Learning Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    # Official Anthropic/OpenAI/Gemini SDKs behind the LLMProvider
    # abstraction (TASK-014, CLAUDE.md §6/§19, docs/PRD.md §22): a
    # hand-rolled REST client over `requests` or a third-party unifying
    # library were both considered and rejected -- see
    # app/llm/anthropic_provider.py, app/llm/openai_provider.py and
    # app/llm/gemini_provider.py module docstrings for the full rationale.
    # `google-genai` was added to support a free-tier LLM_PROVIDER option
    # (Gemini Developer API, no billing required), unlike Anthropic/OpenAI.
    "anthropic>=1.5",
    "openai>=3.14",
    "google-genai>=2.25.0",
    "feedparser>=6.0",
    "langdetect>=1.0",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "requests>=2.31",
    "tzdata>=2024.1; sys_platform == 'win32'",
    # PDF rendering for the newspaper generator (TASK-021, CLAUDE.md §7,
    # docs/PRD.md §16, docs/ARCHITECTURE.md §1.1): explicitly mandated by
    # the PRD, not an open choice -- see app/newspaper/renderer.py.
    "reportlab>=5.0.1",
    # CLI framework (TASK-023, docs/PRD.md §32, docs/ARCHITECTURE.md §1.2):
    # typed command signatures, consistent with CLAUDE.md §8; approved over
    # the stdlib `argparse` alternative during TASK-023 FASE 0.
    "typer>=0.27.2",
    "trafilatura>=2.2.0",
    # Web app showing the published editions (TASK-044): a server reading
    # the database was chosen by the user over a statically generated site.
    # Brings Jinja2, whose HTML autoescaping keeps untrusted web-derived text
    # (titles, summaries, source names) inert (CLAUDE.md §10-11).
    "flask>=3.1",
]

[project.scripts]
ai-daily = "app.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "responses>=0.25",
    "types-requests>=2.31",
    "types-reportlab>=5.0.0.20260911",
    # Test-only: parses generated PDFs back into text/page structure for
    # TASK-021's structural tests (tests/test_newspaper_renderer.py) --
    # not used by any runtime code.
    "pypdf>=6.18.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["app"]

# feedparser ships no py.typed marker and no stubs package exists on PyPI
# (checked for TASK-007); every other dependency here has real types.
[[tool.mypy.overrides]]
module = "feedparser"
ignore_missing_imports = true

# langdetect ships no py.typed marker and no stubs package exists on PyPI
# (checked for TASK-008); the wildcard also covers its submodules
# (e.g. langdetect.lang_detect_exception).
[[tool.mypy.overrides]]
module = "langdetect.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
