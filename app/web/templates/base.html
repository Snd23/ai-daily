<!doctype html>
<html lang="{{ page_language }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>{% block title %}AI Daily{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="wordmark" href="{{ url_for('index') }}"><span class="pulse" aria-hidden="true"></span>AI<b>DAILY</b></a>
      {% block topbar %}{% endblock %}
    </div>
  </header>
  {% block content %}{% endblock %}
  <footer class="site-footer">
    <div class="wrap">
      <span class="wordmark wordmark-small"><span class="pulse" aria-hidden="true"></span>AI<b>DAILY</b></span>
      <span>{{ ui.tagline }}</span>
    </div>
  </footer>
</body>
</html>
