# Configured news sources for AI Daily (TASK-006).
#
# Structure: {sources: [entry, ...]}, one entry per app.database.source.Source
# (docs/PRD.md §6, docs/ARCHITECTURE.md §3). Every field below is required —
# `Source` defines no defaults, so none are assumed here either.
#
# reliability_weight is a plain, hand-entered configuration value in this
# task (0.0-1.0, roughly aligned with `tier` below). No algorithm computes
# it: the actual semantics and scoring logic belong to the future Source
# reliability task. Treat these numbers as an initial, revisable curation,
# not a computed result.
#
# Every URL below was checked (September 2026) to be a real, currently
# reachable feed or official page — either fetched directly and confirmed
# to be a working RSS/Atom feed, or, where direct fetching was blocked by
# anti-bot protection (BBC, The Guardian, The Verge, Ars Technica, Wired,
# Reddit), cross-confirmed as the canonical, actively-used feed URL via
# multiple independent, unrelated sources (feed-reader directories, RSS
# aggregator services, and/or open-source tools that consume that exact
# URL). No RSS/API endpoint was guessed or invented.
#
# `type: html` is used only where the organization does not publish an RSS
# feed at all (confirmed by search): the URL then points at a real,
# verified official page (docs/ARCHITECTURE.md §2's HtmlCollector), not a
# feed.
#
# categories are free-form source tags (docs/PRD.md §6 example), unrelated
# to the `category` table's fixed slugs used to classify Event rows.

sources:
  # --- Tier 1: primary/official sources -------------------------------

  - name: OpenAI
    type: rss
    url: https://openai.com/news/rss.xml
    tier: 1
    categories:
      - models
      - business
      - research
    reliability_weight: 1.0
    is_active: true

